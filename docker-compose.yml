services:
  postgres:
    image: postgres:18.6-alpine
    container_name: api-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: api_core
      POSTGRES_PASSWORD: api_core
      POSTGRES_DB: api_core
    ports:
      - "5433:5432"
    volumes:
      - api_core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_core -d api_core"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  api_core_pgdata:
